<article class="card" data-urgency="{{ .Params.urgency | default "normal" }}">
  <p class="eyebrow">{{ .Params.status | default "proposed" }} ·
    {{ .Params.urgency | default "normal" }} priority</p>
  <h3><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h3>
  <p>{{ .Summary }}</p>
  <a href="{{ .RelPermalink }}">{{ site.Params.actionLabel }}</a>
</article>
